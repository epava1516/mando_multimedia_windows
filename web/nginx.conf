worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    autoindex off;
    gzip on;
    gzip_types text/css text/plain application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'" always;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~ /\. { deny all; }
        location ~* \.(apk|exe|zip)$ {
            types { application/vnd.android.package-archive apk; }
            # Per transfer bandwidth cap from the start.
            limit_rate 2m;
            # Keep release links fresh; the checksum identifies the exact build.
            expires -1;
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
        }
        location / {
            expires -1;
            try_files $uri $uri/ =404;
            limit_except GET HEAD { deny all; }
        }
    }
}
