name: mando-web-web
services:
  mando-web-web:
    image: vps-security/nginx:1.30-security-20261116
    container_name: mando-web-web
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./public:/usr/share/nginx/html:ro,Z
    networks: [proxy]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      prune.protect: "true"
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_DOCKER_NETWORK}"
      traefik.http.routers.mando-web.rule: "Host(`${MANDO_DOMAIN}`)"
      traefik.http.routers.mando-web.service: "mando-web"
      traefik.http.routers.mando-web.entrypoints: "${TRAEFIK_ENTRYPOINT_SECURE}"
      traefik.http.routers.mando-web.tls: "true"
      traefik.http.routers.mando-web.tls.certresolver: "${TRAEFIK_CERTRESOLVER}"
      # Public presentation: no CrowdSec or download rate limit.
      traefik.http.routers.mando-web-downloads.rule: "Host(`${MANDO_DOMAIN}`) && PathRegexp(`(?i)^/downloads/.*[.](apk|exe|zip)$`)"
      traefik.http.routers.mando-web-downloads.priority: "100"
      traefik.http.routers.mando-web-downloads.entrypoints: "${TRAEFIK_ENTRYPOINT_SECURE}"
      traefik.http.routers.mando-web-downloads.tls: "true"
      traefik.http.routers.mando-web-downloads.tls.certresolver: "${TRAEFIK_CERTRESOLVER}"
      traefik.http.routers.mando-web-downloads.service: "mando-web"
      traefik.http.routers.mando-web-downloads.middlewares: "mando-download-rate,mando-download-concurrent"
      # Default source criterion uses the connection IP, not a caller-supplied XFF.
      traefik.http.middlewares.mando-download-rate.ratelimit.average: "6"
      traefik.http.middlewares.mando-download-rate.ratelimit.period: "1m"
      traefik.http.middlewares.mando-download-rate.ratelimit.burst: "6"
      traefik.http.middlewares.mando-download-concurrent.inflightreq.amount: "2"
      traefik.http.services.mando-web.loadbalancer.server.port: "8080"
networks:
  proxy:
    external: true
