name: Windows components
on:
  workflow_dispatch:
  push:
    branches: [codex/own-windows-server]
    paths: [windows-server/**, windows-zoom/**, .github/workflows/windows-validation.yml]
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile broker and integrated zoom
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path build | Out-Null
          Add-Type -TypeDefinition (Get-Content windows-server/desktop/MandoDesktopBroker.cs -Raw) -Language CSharp -ReferencedAssemblies 'System.dll','System.Core.dll','System.ServiceProcess.dll','System.Web.Extensions.dll' -OutputAssembly "$pwd/build/MandoDesktopBroker.exe" -OutputType WindowsApplication
          Add-Type -TypeDefinition (Get-Content windows-zoom/MandoTouchZoom.cs -Raw) -Language CSharp -OutputAssembly "$pwd/build/MandoTouchZoom.exe" -OutputType WindowsApplication
          $result = Start-Process -FilePath "$pwd/build/MandoDesktopBroker.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Broker self-test failed' }
      - name: Parse installer scripts
        shell: powershell
        run: |
          Get-ChildItem windows-server -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Python protocol and adapter tests
        shell: powershell
        run: |
          python -m pip install -r windows-server/requirements.txt
          python -m unittest discover -s windows-server/tests -v
      - name: Real Windows clipboard URL fixtures
        shell: powershell
        env:
          MANDO_TEST_CLIPBOARD: '1'
        run: |
          python windows-server/tests/test_clipboard_native.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native clipboard URL test failed' }
      - name: Install local broker and verify pipe identity without input
        shell: powershell
        run: |
          try {
            & ./windows-server/Instalar-MandoCompleto.ps1
            python -c "import sys,time; sys.path.insert(0,'windows-server'); from desktop_bridge import DesktopBridge; b=DesktopBridge(); ok=False; exec('for i in range(20):\n try:\n  b.connect(); ok=True; break\n except OSError:\n  time.sleep(.25)'); assert ok, 'Cannot connect to verified broker'; b.close()"
            if ($LASTEXITCODE -ne 0) { throw 'Broker pipe identity check failed' }
          } finally {
            if (Test-Path "$env:ProgramFiles/MandoDesktop/mando-install.json") { & ./windows-server/Desinstalar-MandoCompleto.ps1 }
          }
      - name: Build standalone network server
        shell: powershell
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --clean --noconfirm --onefile --name MandoServer windows-server/server.py
          if ($LASTEXITCODE -ne 0) { throw 'Standalone server build failed' }
          python windows-server/tests/test_frozen_server.py dist/MandoServer.exe
          if ($LASTEXITCODE -ne 0) { throw 'Standalone TLS smoke test failed' }
      - name: Build and verify Windows installer
        shell: powershell
        run: |
          $compilerSetup = Join-Path $pwd 'build/innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $compilerSetup
          $signature = Get-AuthenticodeSignature -FilePath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Inno Setup signature verification failed' }
          $compilerDir = Join-Path $pwd 'build/inno'
          $tool = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$compilerDir+'"')) -Wait -PassThru
          if ($tool.ExitCode -ne 0) { throw 'Compiler setup failed' }
          $payload = Join-Path $pwd 'build/installer-payload'
          New-Item -ItemType Directory -Force -Path "$payload/desktop","$payload/windows-zoom" | Out-Null
          Copy-Item dist/MandoServer.exe,windows-server/Instalar-MandoCompleto.ps1,windows-server/Desinstalar-MandoCompleto.ps1,windows-server/installer/Configure-Mando.ps1,windows-server/installer/LEEME.txt $payload
          Copy-Item windows-server/desktop/MandoDesktopBroker.cs "$payload/desktop/"
          Copy-Item windows-zoom/MandoTouchZoom.cs "$payload/windows-zoom/"
          & "$compilerDir/ISCC.exe" ("/DPayloadDir="+$payload) windows-server/installer/MandoSetup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed' }
          $setup = Start-Process -FilePath "$pwd/dist/MandoSetup-0.5.0-alpha.9.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          if ((Get-Service MandoDesktopBroker).Status -ne 'Running') { throw 'Installed service is not running' }
          if (-not (Test-Path "$env:ProgramFiles/Mando/MandoServer.exe")) { throw 'Network server not installed' }
          $setup = Start-Process -FilePath "$pwd/dist/MandoSetup-0.5.0-alpha.9.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer upgrade failed' }
          $remove = Start-Process -FilePath "$env:ProgramFiles/Mando/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Get-Service MandoDesktopBroker -ErrorAction SilentlyContinue)) { throw 'Installer uninstall failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mando-windows-executables
          path: |
            dist/MandoServer.exe
            dist/MandoSetup-0.5.0-alpha.9.exe
            build/MandoDesktopBroker.exe
            build/MandoTouchZoom.exe
          retention-days: 7
